name: Validate and package skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and zip every skill
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip
